# docker compose up -d --build
# usar --build para reconstruir
# luego de crear la base de datos usar este script
# CREATE EXTENSION IF NOT EXISTS "pgcrypto";
version: '3.9'

services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres_ergo_proxy
    restart: unless-stopped

    ports:
      - "5432:5432"

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
        - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend

  app:
    build: .
    container_name: ergo-proxy-app
    ports:
    - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend


volumes:
  postgres_data:

networks:
    backend:
      driver: bridge